<script>
    // Q4.Traffic Light simulator:Simulates a traffic light system, displaying appropriate messages based on input('red,green,yellow')
let Light=prompt("Enter the value")
Switch (Light) {
    case'Red':
        console.log("Stop")
        break;
        case'Yellow':
            console.log("Get Ready to stop")
            break;
            case'Green':
                console.log("Go")
                break;
                default:
                    console.log("Invaild")
                    break;
                }
